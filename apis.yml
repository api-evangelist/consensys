aid: consensys
name: Consensys
description: >-
  Consensys is a blockchain and Web3 software company founded by Ethereum
  co-founder Joseph Lubin that builds core Ethereum infrastructure and developer
  tooling for the decentralized web. Its product suite includes MetaMask (the
  self-custodial wallet and MetaMask Developer / Connect SDK), Infura (managed,
  high-availability JSON-RPC blockchain node APIs, IPFS, and a Gas API across
  Ethereum and 40+ EVM networks), Linea (a zkEVM Layer 2 network), Besu and Teku
  (execution and consensus clients), and Diligence/MythX smart-contract security
  tooling. Developers use Infura's API-key-authenticated JSON-RPC 2.0 endpoints
  to read and broadcast to Ethereum, Base, Arbitrum, Optimism, Polygon, Linea and
  more without operating their own nodes.
