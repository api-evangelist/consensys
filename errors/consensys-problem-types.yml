generated: '2026-07-18'
method: searched
source: https://docs.infura.io/ + JSON-RPC 2.0 specification
format: json-rpc-2.0
envelope: '{"jsonrpc":"2.0","id":1,"error":{"code":<int>,"message":"<string>","data":<optional>}}'
note: >-
  Infura returns standard JSON-RPC 2.0 error objects in the response body, plus
  HTTP-level status codes for auth and rate limiting. Codes below are the
  JSON-RPC standard set and the Infura HTTP responses documented for the service.
json_rpc_errors:
  - code: -32700
    title: Parse error
    meaning: Invalid JSON was received by the server.
  - code: -32600
    title: Invalid request
    meaning: The JSON sent is not a valid Request object.
  - code: -32601
    title: Method not found
    meaning: The method does not exist / is not available (or not supported by Infura).
  - code: -32602
    title: Invalid params
    meaning: Invalid method parameter(s).
  - code: -32603
    title: Internal error
    meaning: Internal JSON-RPC error.
  - code: -32000
    title: Server error
    meaning: Generic server-side error (e.g. execution reverted, resource limits).
http_errors:
  - status: 401
    title: Unauthorized
    remediation: Missing/invalid API key. Check the key in the URL path and any required secret.
  - status: 403
    title: Forbidden
    remediation: Key allowlist/restrictions blocked the request (origin, method, contract).
  - status: 429
    title: Too Many Requests
    remediation: Daily credit quota or throughput limit exceeded; back off or upgrade plan.
  - status: 500
    title: Internal Server Error
    remediation: Transient upstream/node error; retry with backoff.
